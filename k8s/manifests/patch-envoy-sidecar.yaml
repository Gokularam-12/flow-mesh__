spec:
  template:
    spec:
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-bootstrap
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.29-latest
        args: ["-c", "/etc/envoy/envoy.yaml", "--service-node", "flowmesh-node", "--service-cluster", "flowmesh"]
        ports:
        - containerPort: 10000
          name: proxy
        - containerPort: 9901
          name: admin
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
